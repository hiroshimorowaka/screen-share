[workspace]
members = ["apps/server", "apps/web", "crates/domain", "crates/protocol", "crates/signaling"]
resolver = "2"

# Line-tables-only debug info for dev builds. With full `debug = 2`, the
# combined `.debug_info` of the ~250-crate dependency graph overflows the
# 32-bit relocation range when rust-lld links the `screen_share` binary
# ("relocation R_X86_64_32 out of range"). Line tables keep backtraces
# useful and also cut link time. Profiles are only read from the
# workspace root, so this must live here.
[profile.dev]
debug = 1

# Size-optimized profile for the WASM bundle in release mode.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "screen_share"
bin-package = "screen-share-server"
lib-package = "screen_share"

# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle.
# MUST stay in sync with LEPTOS_OUTPUT_NAME in .cargo/config.toml.
output-name = "screen_share"

# cargo-leptos resolves these paths relative to this workspace-root directory.
# WARNING: all content of site-root is erased on a rebuild.
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "apps/web/public"

# The IP and port where the server serves the content.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring.
reload-port = 3001

# The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# `cargo leptos end-to-end` builds + serves the app, then runs this in
# `end2end-dir`. The Playwright project there also has its own
# `webServer`, so `npx playwright test` works standalone too.
end2end-cmd = "npx playwright test"
end2end-dir = "apps/web/end2end"

# Features/profile for the bin (SSR) target.
bin-features = ["ssr"]
bin-default-features = false

# Features for the lib (hydrate) target.
lib-features = ["hydrate"]
lib-default-features = false

# The profile to use for the lib target when compiling for release.
lib-profile-release = "wasm-release"

# Appends a content hash to the compiled JS/WASM bundle's filename on every
# build (via a `hash.txt` cargo-leptos writes next to the server binary —
# see the Dockerfile). Without this, the bundle keeps the same URL across
# deploys, and a browser that cached it under its own heuristics (no
# `Cache-Control` on that response otherwise says how long) can keep
# serving the old JS/WASM until a hard refresh. `security::apply` gives
# `/pkg/` a long-lived immutable `Cache-Control` on top of this, since the
# filename is now the thing that changes instead.
hash-files = true
