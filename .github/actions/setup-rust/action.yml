name: Set up Rust
description: >
  Stable Rust toolchain, Swatinem build cache, and (optionally) one
  cargo tool via taiki-e/install-action. Checkout is the caller's job.

inputs:
  targets:
    description: Comma-separated rustup targets to add (e.g. wasm32-unknown-unknown).
    default: ''
  components:
    description: Comma-separated rustup components to add (e.g. llvm-tools-preview).
    default: ''
  tool:
    description: >
      A tool for taiki-e/install-action, e.g. `cargo-leptos`,
      `cargo-mutants`, `cargo-llvm-cov`, `wasm-bindgen-cli@0.2.127`.
      Empty = install nothing.
    default: ''
  cache-workspaces:
    description: Passed through to Swatinem/rust-cache `workspaces`.
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
    - if: inputs.tool != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tool }}
