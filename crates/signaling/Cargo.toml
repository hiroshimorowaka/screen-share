[package]
name = "screen-share-signaling"
version = "0.1.0"
edition = "2021"

[lib]
name = "screen_share_signaling"

[dependencies]
screen-share-protocol = { path = "../protocol" }
axum = { version = "0.8.0", features = ["ws"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
futures-util = "0.3.34"
serde_json = "1.0.151"
argon2 = { version = "0.5.3", features = ["std"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
uuid = { version = "1.24.1", features = ["v4"] }
rand = "0.10.2"

[dev-dependencies]
screen-share-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3.34"
serde_json = "1.0.151"
argon2 = { version = "0.5.3", features = ["std"] }
