[package]
name = "screen_share"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
screen-share-domain = { path = "../../crates/domain" }
screen-share-protocol = { path = "../../crates/protocol" }
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen-futures = { version = "0.4.77", optional = true }
js-sys = { version = "0.3.104", optional = true }
# Wraps a `!Send` browser handle so it can be moved into `on_cleanup`
# (which is `Send + Sync` bound). Sound on wasm: single-threaded, and the
# wrapper panics if ever touched from another thread. Already in the tree
# via leptos.
send_wrapper = { version = "0.6", optional = true }
web-sys = { version = "0.3.104", optional = true, features = [
    "WebSocket",
    "MessageEvent",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "DisplayMediaStreamConstraints",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaTrackConstraints",
    "MediaStreamConstraints",
    "MediaQueryList",
    "ConstrainDomStringParameters",
    "Navigator",
    "Window",
    "Location",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcIceCandidateInit",
    "RtcIceCandidate",
    "RtcPeerConnectionIceEvent",
    "RtcTrackEvent",
    "RtcIceConnectionState",
    "RtcRtpSender",
    "RtcRtpReceiver",
    "RtcRtpTransceiver",
    "RtcRtpTransceiverInit",
    "RtcRtpTransceiverDirection",
    "RtcRtpParameters",
    "RtcRtpEncodingParameters",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "Element",
    "NodeList",
    "PictureInPictureWindow",
    "MediaStreamTrackGenerator",
    "MediaStreamTrackGeneratorInit",
    "AudioData",
    "AudioDataInit",
    "AudioSampleFormat",
    "AudioContext",
    "BaseAudioContext",
    "AnalyserNode",
    "MediaStreamAudioSourceNode",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "Clipboard",
    "Storage",
    "Response",
    "Crypto",
    "Performance",
    "console",
    # Synthetic event dispatch, used by `infra::dom`'s wasm tests.
    "Event",
] }

[dev-dependencies]
# Browser test harness for the `hydrate` (wasm32) code path. Its version
# must stay compatible with the `wasm-bindgen` version in Cargo.lock
# (the two crates are released in lockstep); `wasm-bindgen-test` pins an
# exact `=` requirement on `wasm-bindgen`, so Cargo enforces the pairing.
wasm-bindgen-test = "=0.3.77"

# `leptos::task::spawn_local` (used by `session::media::start_sharing`)
# needs a global executor initialized first — `leptos::mount::hydrate_body`
# does this for the real app, but the wasm test harness never calls it, so
# tests that exercise a `spawn_local`'d path init one explicitly.
any_spawner = "0.3"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:send_wrapper",
]
# `apps/web` no longer owns the Axum host (that is `apps/server`). This
# feature stays because the crate's components still render server-side:
# `apps/server` builds this library with `ssr` on to produce the initial
# HTML, so the leptos stack needs its `ssr` halves and the per-request
# CSP nonce on the inline hydration bootstrap (see
# `screen_share_server::middleware::security`).
ssr = [
    "leptos/ssr",
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
