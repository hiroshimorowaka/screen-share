[package]
name = "screen_share"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
screen-share-protocol = { path = "../../crates/protocol" }
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
axum = { version = "0.8.0", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.1", features = ["v4"], optional = true }
rand = { version = "0.10.2", optional = true }
futures-util = { version = "0.3.34", optional = true }
wasm-bindgen-futures = { version = "0.4.77", optional = true }
js-sys = { version = "0.3.104", optional = true }
web-sys = { version = "0.3.104", optional = true, features = [
    "WebSocket",
    "MessageEvent",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "DisplayMediaStreamConstraints",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaTrackConstraints",
    "MediaStreamConstraints",
    "ConstrainDomStringParameters",
    "Navigator",
    "Window",
    "Location",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcSdpType",
    "RtcSessionDescriptionInit",
    "RtcIceCandidateInit",
    "RtcIceCandidate",
    "RtcPeerConnectionIceEvent",
    "RtcTrackEvent",
    "RtcIceConnectionState",
    "RtcRtpSender",
    "RtcRtpParameters",
    "RtcRtpEncodingParameters",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "Element",
    "NodeList",
    "PictureInPictureWindow",
    "MediaStreamTrackGenerator",
    "MediaStreamTrackGeneratorInit",
    "AudioData",
    "AudioDataInit",
    "AudioSampleFormat",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "Clipboard",
    "Storage",
    "Response",
    "Crypto",
    "Performance",
    "console",
] }
argon2 = { version = "0.5.3", optional = true, features = ["std"] }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:uuid",
    "dep:rand",
    "dep:futures-util",
    "dep:argon2",
    "dep:hmac",
    "dep:sha1",
    "dep:base64",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
argon2 = ["dep:argon2"]

[dev-dependencies]
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["test-util"] }
