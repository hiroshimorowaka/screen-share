[package]
name = "screen_share"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
screen-share-protocol = { path = "../../crates/protocol" }
screen-share-signaling = { path = "../../crates/signaling", optional = true }
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
axum = { version = "0.8.0", optional = true }
# SSR-only DoS layers on the HTTP routes (request timeout + global
# concurrency cap); already in the tree via axum/leptos_axum.
tower = { version = "0.5", features = ["util", "limit"], optional = true }
tower-http = { version = "0.6", features = ["timeout"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen-futures = { version = "0.4.77", optional = true }
js-sys = { version = "0.3.104", optional = true }
# Wraps a `!Send` browser handle so it can be moved into `on_cleanup`
# (which is `Send + Sync` bound). Sound on wasm: single-threaded, and the
# wrapper panics if ever touched from another thread. Already in the tree
# via leptos.
send_wrapper = { version = "0.6", optional = true }
web-sys = { version = "0.3.104", optional = true, features = [
    "WebSocket",
    "MessageEvent",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "DisplayMediaStreamConstraints",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaTrackConstraints",
    "MediaStreamConstraints",
    "MediaQueryList",
    "ConstrainDomStringParameters",
    "Navigator",
    "Window",
    "Location",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcIceCandidateInit",
    "RtcIceCandidate",
    "RtcPeerConnectionIceEvent",
    "RtcTrackEvent",
    "RtcIceConnectionState",
    "RtcRtpSender",
    "RtcRtpReceiver",
    "RtcRtpTransceiver",
    "RtcRtpTransceiverInit",
    "RtcRtpTransceiverDirection",
    "RtcRtpParameters",
    "RtcRtpEncodingParameters",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "Element",
    "NodeList",
    "PictureInPictureWindow",
    "MediaStreamTrackGenerator",
    "MediaStreamTrackGeneratorInit",
    "AudioData",
    "AudioDataInit",
    "AudioSampleFormat",
    "AudioContext",
    "BaseAudioContext",
    "AnalyserNode",
    "MediaStreamAudioSourceNode",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "Clipboard",
    "Storage",
    "Response",
    "Crypto",
    "Performance",
    "console",
    # Synthetic event dispatch, used by `infra::dom`'s wasm tests.
    "Event",
] }

[dev-dependencies]
# Browser test harness for the `hydrate` (wasm32) code path. Its version
# must stay compatible with the `wasm-bindgen` version in Cargo.lock
# (the two crates are released in lockstep); `wasm-bindgen-test` pins an
# exact `=` requirement on `wasm-bindgen`, so Cargo enforces the pairing.
wasm-bindgen-test = "=0.3.77"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:send_wrapper",
]
ssr = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:screen-share-signaling",
    "leptos/ssr",
    # Per-request CSP nonce on the inline hydration bootstrap, so
    # `script-src` can drop `'unsafe-inline'` (see `http_security`).
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
