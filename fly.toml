app = "screen-share-h0rb5w"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  LEPTOS_OUTPUT_NAME = "screen_share"
  LEPTOS_SITE_ROOT = "site"
  LEPTOS_SITE_PKG_DIR = "pkg"
  LEPTOS_ENV = "PROD"
  # Only this origin may open a /ws signaling socket from a browser
  # (defence in depth — see crates/signaling/src/handshake.rs). Update
  # alongside the app's public hostname and the desktop APP_URL.
  SIGNALING_ALLOWED_ORIGINS = "https://screen-share-h0rb5w.fly.dev"
  # Behind Fly's edge, which rewrites fly-client-ip from the real TCP
  # connection, so it's safe to key the wrong-password lockout on it.
  # MUST stay unset (or false) on any deployment where the app is
  # reachable without going through a trusted proxy.
  TRUST_PROXY_HEADERS = "true"
  # TURN_SECRET is NOT set here, it's a secret:
  #   fly secrets set TURN_SECRET=$(openssl rand -hex 32)
  #
  # TURN_RELAY_IP pins coturn's actual relay sockets to this machine's own
  # private address (`grep 'Private address' -A1 /etc/hosts` over SSH) rather
  # than letting it auto-discover every local interface. Needed because
  # Fly's dedicated IP is edge-routed, not bound to a real interface inside
  # the VM — `turnutils_stunclient` run from inside this same VM against
  # 137.66.9.162 hangs forever, confirming there's no NAT hairpin back to
  # itself through the public IP. Will need updating if this machine is ever
  # recreated with a different private address.
  TURN_EXTERNAL_IP = "137.66.9.162"
  TURN_RELAY_IP = "172.19.29.58"
  TURN_URLS = "turn:137.66.9.162:3478"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# TURN control port (STUN + TURN allocate/refresh) and the relay port range
# coturn hands out from — see docker-entrypoint.sh. Raw UDP, so these need a
# *dedicated* IPv4/IPv6 on this app (`fly ips allocate-v4` /
# `fly ips allocate-v6`) — the shared anycast IP Fly gives every app by
# default is routed by SNI/Host header at L7 and can't carry plain UDP.
#
# A port *range* uses `start_port` + `end_port` (a single port uses `port`);
# giving `end_port` without `start_port` fails the deploy with
# "Port range missing start_port".
[[services]]
  internal_port = 3478
  protocol = "udp"
  processes = ["app"]

  [[services.ports]]
    port = 3478

[[services]]
  internal_port = 49160
  protocol = "udp"
  processes = ["app"]

  [[services.ports]]
    start_port = 49160
    end_port = 49300

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
