<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Escolha o que compartilhar</title>
    <style>
      :root {
        --bg: #313338;
        --surface: #2b2d31;
        --surface-2: #1e1f22;
        --border: rgba(255, 255, 255, 0.06);
        --text: #f2f3f5;
        --text-dim: #949ba4;
        --accent: #5865f2;
        --accent-strong: #7983f5;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      .hidden {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }

      body {
        display: flex;
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }

      #panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        background: var(--bg);
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      header {
        padding: 20px 24px 0;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 16px;
      }

      #tabs {
        display: flex;
        gap: 4px;
        background: var(--surface-2);
        border-radius: 8px;
        padding: 4px;
      }

      .tab {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
      }

      .tab.active {
        background: var(--surface);
        color: var(--text);
      }

      .tab svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      main {
        flex: 1;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 20px 24px 24px;
      }

      main::-webkit-scrollbar {
        width: 8px;
      }

      main::-webkit-scrollbar-track {
        background: transparent;
      }

      main::-webkit-scrollbar-thumb {
        background: var(--surface-2);
        border-radius: 8px;
      }

      main::-webkit-scrollbar-thumb:hover {
        background: var(--text-dim);
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      #empty {
        color: var(--text-dim);
        font-size: 13px;
        padding: 32px 0;
        text-align: center;
      }

      .source {
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 8px;
        background: var(--surface);
        transition: border-color 0.1s ease;
      }

      .source:hover,
      .source:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 4px;
        background: var(--surface-2);
        object-fit: contain;
        display: block;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .app-icon {
        display: block;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        flex-shrink: 0;
        background: var(--surface-2);
        object-fit: cover;
      }

      .label span {
        font-size: 12px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <h1>O que você quer compartilhar?</h1>
        <div id="tabs">
          <button class="tab active" data-tab="window">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M3 9h18" />
            </svg>
            Aplicativos
          </button>
          <button class="tab" data-tab="screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M8 20h8M12 17v3" />
            </svg>
            Tela inteira
          </button>
        </div>
      </header>
      <main>
        <div id="grid"></div>
        <div id="empty" class="hidden">Nada disponível nessa aba.</div>
      </main>
    </div>
    <script src="picker.js"></script>
  </body>
</html>
