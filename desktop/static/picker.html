<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Escolha o que compartilhar</title>
    <style>
      :root {
        --bg: #313338;
        --surface: #2b2d31;
        --surface-2: #1e1f22;
        --border: rgba(255, 255, 255, 0.06);
        --text: #f2f3f5;
        --text-dim: #949ba4;
        --accent: #5865f2;
        --accent-strong: #7983f5;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      .hidden {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        /* Matches the BrowserWindow's backgroundColor — the window is no
           longer `transparent` (unreliable on headless/VM Windows). */
        background: var(--surface-2);
      }

      body {
        display: flex;
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }

      #panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        background: var(--bg);
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      header {
        padding: 20px 24px 0;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 16px;
      }

      #tabs {
        display: flex;
        gap: 4px;
        background: var(--surface-2);
        border-radius: 8px;
        padding: 4px;
      }

      .tab {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
      }

      .tab.active {
        background: var(--surface);
        color: var(--text);
      }

      .tab svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      /* Shared building block: a checkbox visually replaced by a styled box
         + checkmark, used both for "Compartilhar áudio" and every item in
         the exclusion dropdown below. The real <input> stays in the DOM
         (kept keyboard/screen-reader accessible) but visually hidden — the
         sibling <span> box reacts to its :checked/:focus-visible state. */
      .styled-checkbox-input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .styled-checkbox-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: 5px;
        border: 1.5px solid var(--text-dim);
        background: var(--surface-2);
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }

      .styled-checkbox-check {
        width: 11px;
        height: 11px;
        color: #fff;
        opacity: 0;
        transform: scale(0.6);
        transition:
          opacity 0.12s ease,
          transform 0.12s ease;
      }

      label:hover .styled-checkbox-input:not(:checked) + .styled-checkbox-box {
        border-color: var(--accent-strong);
      }

      .styled-checkbox-input:checked + .styled-checkbox-box {
        background: var(--accent);
        border-color: var(--accent);
      }

      .styled-checkbox-input:checked + .styled-checkbox-box .styled-checkbox-check {
        opacity: 1;
        transform: scale(1);
      }

      .styled-checkbox-input:focus-visible + .styled-checkbox-box {
        outline: 2px solid var(--accent-strong);
        outline-offset: 2px;
      }

      .audio-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--text-dim);
        margin: 14px 0;
        cursor: pointer;
        user-select: none;
      }

      #audio-exclude-panel {
        margin-bottom: 14px;
      }

      .exclude-panel__label {
        margin: 0 0 6px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .exclude-dropdown {
        position: relative;
      }

      .exclude-dropdown__trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 8px;
        padding: 8px 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-dim);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.12s ease;
      }

      .exclude-dropdown__trigger:hover,
      .exclude-dropdown__trigger.exclude-dropdown__trigger--open {
        border-color: var(--accent-strong);
      }

      .exclude-dropdown__trigger--has-selection {
        color: var(--text);
      }

      .exclude-dropdown__summary {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .exclude-dropdown__chevron {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        transition: transform 0.12s ease;
      }

      .exclude-dropdown__trigger--open .exclude-dropdown__chevron {
        transform: rotate(180deg);
      }

      .exclude-dropdown__list {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        z-index: 10;
        max-height: 180px;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .exclude-dropdown__list label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }

      .exclude-dropdown__list label:hover {
        background: var(--surface-2);
      }

      main {
        flex: 1;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 20px 24px 24px;
      }

      main::-webkit-scrollbar {
        width: 8px;
      }

      main::-webkit-scrollbar-track {
        background: transparent;
      }

      main::-webkit-scrollbar-thumb {
        background: var(--surface-2);
        border-radius: 8px;
      }

      main::-webkit-scrollbar-thumb:hover {
        background: var(--text-dim);
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      #empty {
        color: var(--text-dim);
        font-size: 13px;
        padding: 32px 0;
        text-align: center;
      }

      .source {
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 8px;
        background: var(--surface);
        transition: border-color 0.1s ease;
      }

      .source:hover,
      .source:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 4px;
        background: var(--surface-2);
        object-fit: contain;
        display: block;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .app-icon {
        display: block;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        flex-shrink: 0;
        background: var(--surface-2);
        object-fit: cover;
      }

      .label span {
        font-size: 12px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <h1>O que você quer compartilhar?</h1>
        <label class="audio-toggle" id="audio-checkbox-label">
          <input type="checkbox" id="audio-checkbox" class="styled-checkbox-input" />
          <span class="styled-checkbox-box">
            <svg class="styled-checkbox-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12l5 5L20 6" />
            </svg>
          </span>
          <span>Compartilhar áudio</span>
        </label>
        <div id="audio-exclude-panel" class="hidden">
          <p class="exclude-panel__label">Excluir do áudio:</p>
          <div class="exclude-dropdown" id="exclude-dropdown">
            <button type="button" class="exclude-dropdown__trigger" id="exclude-dropdown-trigger">
              <span class="exclude-dropdown__summary" id="exclude-dropdown-summary">Nenhum</span>
              <svg class="exclude-dropdown__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div id="audio-exclude-list" class="exclude-dropdown__list hidden"></div>
          </div>
        </div>
        <div id="tabs">
          <button class="tab active" data-tab="window">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M3 9h18" />
            </svg>
            Aplicativos
          </button>
          <button class="tab" data-tab="screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M8 20h8M12 17v3" />
            </svg>
            Tela inteira
          </button>
        </div>
      </header>
      <main>
        <div id="grid"></div>
        <div id="empty" class="hidden">Nada disponível nessa aba.</div>
      </main>
    </div>
    <script src="picker.js"></script>
  </body>
</html>
