# Its own workspace root, deliberately outside the repo-root Cargo
# workspace: this is a Windows-only napi module built on its own by
# `napi build` / electron-builder, with its own Cargo.lock. Without this
# empty table, cargo walks up, finds the root `[workspace]`, and refuses
# to build ("believes it's in a workspace when it's not"). See ADR-0001
# and docs/architecture/desktop.md.
[workspace]

[package]
name = "windows-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
wasapi = "0.24"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
